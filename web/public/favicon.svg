<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Matte Graphite -->
    <linearGradient id="bgMatte" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Document Sheet Gradient: Charcoal / Dark Titanium -->
    <linearGradient id="sheetMatte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Folded Corner Gradient -->
    <linearGradient id="cornerMatte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <!-- Subtle Depth Shadow -->
    <filter id="subtleShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle Container (Minimalist Black/Graphite) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgMatte)" stroke="#27272a" stroke-width="2" />

  <!-- Document Sheet (Charcoal / Titanium with folded corner) -->
  <g filter="url(#subtleShadow)">
    <!-- Sheet Body -->
    <path d="M 136 84 
             C 136 70, 148 58, 162 58 
             L 316 58 
             L 376 118 
             L 376 428 
             C 376 442, 364 454, 350 454 
             L 162 454 
             C 148 454, 136 442, 136 428 
             Z" 
          fill="url(#sheetMatte)" 
          stroke="#3f3f46" 
          stroke-width="2" />

    <!-- Precise Folded Corner -->
    <path d="M 316 58 
             L 316 104 
             C 316 112, 322 118, 330 118 
             L 376 118 
             Z" 
          fill="url(#cornerMatte)" 
          stroke="#52525b" 
          stroke-width="1.5" />
  </g>

  <!-- Markdown Monogram (Crisp Minimalist White & Titanium Gray) -->
  <g>
    <!-- The Iconic 'M' of Markdown -->
    <path d="M 180 200 
             L 180 320 
             L 204 320 
             L 204 246 
             L 242 292 
             C 246 296, 254 296, 258 292 
             L 296 246 
             L 296 320 
             L 320 320 
             L 320 200 
             L 296 200 
             L 250 258 
             L 204 200 
             Z" 
          fill="#f4f4f5" />

    <!-- Minimalist Document Content Lines (Simulating Clean Reading Layout) -->
    <!-- Top Header Bar -->
    <rect x="180" y="140" width="88" height="8" rx="4" fill="#71717a" />
    <rect x="180" y="156" width="48" height="6" rx="3" fill="#52525b" />

    <!-- Bottom Reading Progress & Rule Lines -->
    <rect x="180" y="362" width="152" height="6" rx="3" fill="#52525b" />
    <rect x="180" y="380" width="104" height="6" rx="3" fill="#3f3f46" />
    
    <!-- Discrete Page Dot Accent -->
    <circle cx="326" cy="383" r="3" fill="#a1a1aa" />
  </g>
</svg>
