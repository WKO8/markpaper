<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Ambient Glow Gradient -->
    <radialGradient id="ambientGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Foreground Paper Sheet Gradient -->
    <linearGradient id="sheetGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Folded Corner Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="50%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Electric Monogram Mark Gradient (M + Paper Fold) -->
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Accent Bookmark Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="appShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#020617" flood-opacity="0.25" />
    </filter>

    <filter id="foldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-3" dy="5" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Base Container: Modern Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#appShadow)" stroke="#312e81" stroke-width="2" stroke-opacity="0.4" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#ambientGlow)" />

  <!-- Back Layer: Secondary Document Sheet (Gives publication depth) -->
  <rect x="136" y="70" width="260" height="348" rx="22" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" transform="rotate(4 266 244)" />

  <!-- Main Foreground Document Sheet: Pristine Paper with Fold -->
  <g filter="url(#sheetShadow)">
    <!-- Sheet Body with Top-Right Bevel for Corner Fold -->
    <path d="M 124 96 
             C 124 78, 138 64, 156 64 
             L 322 64 
             L 388 130 
             L 388 392 
             C 388 410, 374 424, 356 424 
             L 156 424 
             C 138 424, 124 410, 124 392 
             Z" 
          fill="url(#sheetGrad)" 
          stroke="#ffffff" 
          stroke-width="1.5" />

    <!-- Folded Corner Flap with Inner Shadow -->
    <path d="M 322 64 
             L 322 110 
             C 322 121, 331 130, 342 130 
             L 388 130 
             Z" 
          fill="url(#foldGrad)" 
          filter="url(#foldShadow)" />
  </g>

  <!-- Editorial Top Ribbon / Header Accent -->
  <path d="M 160 64 L 160 114 L 178 100 L 196 114 L 196 64 Z" fill="url(#accentGrad)" />

  <!-- Editorial Document Lines (Typographic Texture) -->
  <rect x="216" y="96" width="88" height="8" rx="4" fill="#94a3b8" fill-opacity="0.7" />
  <rect x="216" y="112" width="60" height="6" rx="3" fill="#cbd5e1" fill-opacity="0.6" />

  <!-- Central Hero Glyph: Stylized "M" + "P" Origami Fold -->
  <!-- Left Pillar -->
  <rect x="164" y="180" width="28" height="150" rx="14" fill="url(#markGrad)" />

  <!-- Center Diagonal Origami Ribbons -->
  <path d="M 178 188 
           L 242 270 
           C 248 277, 258 277, 264 270 
           L 328 188 
           C 334 180, 346 185, 346 195 
           L 346 316 
           C 346 324, 339 330, 332 330 
           C 325 330, 318 324, 318 316 
           L 318 232 
           L 266 298 
           C 255 311, 237 311, 226 298 
           L 174 232 
           L 174 316 
           C 174 324, 168 330, 160 330 
           C 152 330, 146 324, 146 316 
           L 146 195 
           C 146 185, 158 180, 164 188 
           Z" 
        fill="url(#markGrad)" />

  <!-- Right Pillar Loop (Completing the 'P' Monogram) -->
  <path d="M 318 184 
           L 342 184 
           C 368 184, 386 202, 386 226 
           C 386 250, 368 268, 342 268 
           L 318 268 
           Z" 
        fill="url(#markGrad)" 
        fill-opacity="0.25" 
        stroke="url(#markGrad)" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Bottom Editorial Structure Lines -->
  <rect x="160" y="360" width="192" height="6" rx="3" fill="#cbd5e1" fill-opacity="0.8" />
  <rect x="160" y="376" width="132" height="6" rx="3" fill="#e2e8f0" fill-opacity="0.8" />

  <!-- Small Glowing Status Dot -->
  <circle cx="340" cy="379" r="5" fill="#10b981" />
</svg>
