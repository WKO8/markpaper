<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f4f8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="sheetShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#091e42" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#091e42" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Document Sheet Background -->
  <rect x="76" y="44" width="360" height="424" rx="28" fill="url(#sheetGrad)" filter="url(#sheetShadow)" stroke="#dbeafe" stroke-width="3" />

  <!-- Folded Corner Effect -->
  <path d="M 340 44 L 436 140 L 368 140 A 28 28 0 0 1 340 112 Z" fill="#e2e8f0" />
  <path d="M 340 44 L 436 140 L 436 44 Z" fill="#cbd5e1" opacity="0.4" />

  <!-- Document Heading & Lines -->
  <rect x="124" y="110" width="160" height="24" rx="6" fill="#1e293b" />
  <rect x="124" y="156" width="264" height="12" rx="4" fill="#94a3b8" />
  <rect x="124" y="180" width="220" height="12" rx="4" fill="#94a3b8" />

  <!-- Code/Math Callout Block -->
  <rect x="124" y="216" width="264" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <rect x="144" y="238" width="140" height="10" rx="3" fill="#3b82f6" />
  <rect x="144" y="258" width="180" height="10" rx="3" fill="#64748b" />

  <!-- Markdown 'M' Badge at bottom -->
  <rect x="124" y="318" width="264" height="100" rx="16" fill="url(#badgeGrad)" />
  
  <!-- Markdown Visual Glyphs -->
  <g fill="#ffffff">
    <!-- Letter M -->
    <path d="M 160 382 L 160 348 L 176 366 L 192 348 L 192 382 L 182 382 L 182 364 L 176 372 L 170 364 L 170 382 Z" />
    <!-- Down Arrow / Reader Badge -->
    <path d="M 324 350 L 338 350 L 338 368 L 348 368 L 331 385 L 314 368 L 324 368 Z" />
    <rect x="230" y="362" width="60" height="8" rx="4" fill="#93c5fd" />
  </g>
</svg>
