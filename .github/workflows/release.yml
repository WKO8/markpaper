name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build Web Frontend
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
          cd ..

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Binary (Release)
        run: cargo build --release

      - name: Package Distributable Archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG_NAME="markpaper-${VERSION}-linux-x86_64"
          mkdir -p "dist-pkg/${PKG_NAME}/assets"
          cp target/release/markpaper "dist-pkg/${PKG_NAME}/"
          cp install.sh "dist-pkg/${PKG_NAME}/"
          cp markpaper.desktop "dist-pkg/${PKG_NAME}/"
          cp assets/icon.svg "dist-pkg/${PKG_NAME}/assets/"
          cp README.md "dist-pkg/${PKG_NAME}/"
          cp LICENSE "dist-pkg/${PKG_NAME}/"
          tar -czvf "${PKG_NAME}.tar.gz" -C dist-pkg "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MarkPaper ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            markpaper-*.tar.gz
            markpaper-*.tar.gz.sha256
